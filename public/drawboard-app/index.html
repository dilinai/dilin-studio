<body>

<!-- ───────── 顶栏：菜单 + 语言 ───────── -->
<div id="menubar">
  <div class="brand" data-i18n="ui.brand">堤麟畫板</div>
  <!-- 顶菜单整排由 menubar.js 照 PS／AI 的菜单树生成（menus/*.js）；像素层＝PS、矢量层＝AI -->
  <div class="spacer"></div>
  <div id="agentHint" title="">⌁ <span data-i18n="ui.agentReady"></span></div>
  <select id="langSel">
    <option value="zh-Hant">繁體中文</option>
    <option value="zh-Hans">简体中文</option>
    <option value="en">English</option>
  </select>
</div>

<!-- ───────── 选项栏（随工具变） ───────── -->
<div id="optionbar">
  <span id="optToolName"></span>
  <div id="optBody"></div>
</div>

<div id="main">

  <!-- ───────── 左：工具栏（只放常用的） ───────── -->
  <div id="toolbar">
    <!-- 按钮由 ui.js 生成 -->
  </div>

  <!-- ───────── 中：画布 ───────── -->
  <div id="stage">
    <div id="canvasWrap">
      <canvas id="view"></canvas>
    </div>
    <div id="statusbar">
      <span id="stZoom">100%</span>
      <span id="stSize"></span>
      <span id="stPos">—</span>
      <span class="spacer"></span>
      <span id="stLayer"></span>
    </div>
  </div>

  <!-- ───────── 右：图层面板 ───────── -->
  <div id="rightpanel">
    <!-- 标题改成两颗分页钮（图层｜历史记录），切换由 menus/impl/rp-tabs.js 管 -->
    <div class="rptabs" id="rpTabs">
      <button type="button" class="rptab on" data-tab="layers"><span data-i18n="panel.layers"></span></button>
      <button type="button" class="rptab" data-tab="history">历史记录</button>
    </div>
    <div class="rppane dlp-b" id="rpHistory" style="display:none"></div>
    <div class="rppane" id="rpLayers">
    <div class="layerops">
      <select id="blendSel"></select>
      <label><span data-i18n="panel.opacity"></span>
        <input id="opacityRange" type="range" min="0" max="100" value="100">
        <span id="opacityVal">100</span>
      </label>
    </div>
    <!-- 锁定：照 PS 图层面板四颗（透明像素／图像像素／位置／全部）；按钮只叫 ps.layer.lockLayers，图示由 ui.js 从 icons.js 填 -->
    <div class="lockrow" id="lockRow">
      <span data-i18n="panel.lock"></span>
      <button type="button" class="lockbtn" data-lock="transparency" data-i18n-title="lock.transparency"></button>
      <button type="button" class="lockbtn" data-lock="pixels" data-i18n-title="lock.pixels"></button>
      <button type="button" class="lockbtn" data-lock="position" data-i18n-title="lock.position"></button>
      <button type="button" class="lockbtn" data-lock="all" data-i18n-title="lock.all"></button>
    </div>
    <div id="layerList"></div>
    <div class="layerbtns">
      <button data-cmd="layer.newRaster" title="" data-i18n-title="cmd.layer.newRaster">▣</button>
      <button data-cmd="layer.newVector" title="" data-i18n-title="cmd.layer.newVector">✎</button>
      <button data-cmd="layer.duplicate" title="" data-i18n-title="cmd.edit.duplicate">⧉</button>
      <button data-cmd="layer.delete"    title="" data-i18n-title="cmd.layer.delete">🗑</button>
    </div>
    </div>

    <div class="ph" style="margin-top:10px"><span data-i18n="panel.color"></span></div>
    <div class="colorrow">
      <label><span data-i18n="panel.fill"></span><input type="color" id="fillColor" value="#e8573f"></label>
      <label><span data-i18n="panel.stroke"></span><input type="color" id="strokeColor" value="#ffffff"></label>
      <label><span data-i18n="panel.strokeW"></span><input type="number" id="strokeW" value="0" min="0" max="200" step="1"></label>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">
<input type="file" id="projInput" accept=".dlcanvas,application/json" style="display:none">
